header {

 display: flex;

}
nav a {
   color: white;

   color: #11afa7;

     transform: translateY(-10px);

nav a.activo {

.logo img {
            width: 75px;

}
img:hover{

}
div1{

div1:hover{

}

selection{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-left: 60px;
    column-gap: 25px;
    row-gap: 50px;
    padding: 20px;
}
p{

<script>
/* Menú móvil añadido para navegación en pantallas pequeñas. */
document.addEventListener('DOMContentLoaded', function () {
  const boton = document.querySelector('.menu-toggle');
  const menu = document.querySelector('header nav');
  if (!boton || !menu) return;
  function cerrarMenu() {
    menu.classList.remove('menu-abierto');
    boton.setAttribute('aria-expanded', 'false');
    boton.setAttribute('aria-label', 'Abrir menú de navegación');
  }
  boton.addEventListener('click', function () {
    const abrir = boton.getAttribute('aria-expanded') !== 'true';
    menu.classList.toggle('menu-abierto', abrir);
    boton.setAttribute('aria-expanded', String(abrir));
    boton.setAttribute('aria-label', abrir ? 'Cerrar menú de navegación' : 'Abrir menú de navegación');
  });
  menu.querySelectorAll('a').forEach(function (enlace) { enlace.addEventListener('click', cerrarMenu); });
  document.addEventListener('keydown', function (evento) { if (evento.key === 'Escape') cerrarMenu(); });
  document.addEventListener('click', function (evento) { if (!evento.target.closest('header')) cerrarMenu(); });
  window.addEventListener('resize', function () { if (window.innerWidth > 900) cerrarMenu(); });
});
</script>
